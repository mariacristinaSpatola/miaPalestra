spring.application.name=miaPalestra
spring.profiles.default=dev
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Rome
spring.jackson.time-zone=Europe/Rome
spring.flyway.enabled=true

app.bootstrap-admin.enabled=false
app.bootstrap-admin.username=${APP_BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.first-name=${APP_BOOTSTRAP_ADMIN_FIRST_NAME:Admin}
app.bootstrap-admin.last-name=${APP_BOOTSTRAP_ADMIN_LAST_NAME:}
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}