spring.application.name=miaPalestra
spring.profiles.default=dev
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Rome
spring.jackson.time-zone=Europe/Rome
spring.flyway.enabled=true

app.bootstrap-admin.enabled=true
app.bootstrap-admin.username=${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:12345678}
app.bootstrap-admin.first-name=${APP_BOOTSTRAP_ADMIN_FIRST_NAME:Admin}
app.bootstrap-admin.last-name=${APP_BOOTSTRAP_ADMIN_LAST_NAME:Admin}
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=MIA_PALESTRA_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax